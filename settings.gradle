pluginManagement {
	repositories {
		maven {
			name = 'Fabric'
			url = 'https://maven.fabricmc.net/'
		}
		mavenCentral()
		gradlePluginPortal()
	}
}

// Should match your modid
rootProject.name = 'loadonce'

include 'poc-runtime'
project(':poc-runtime').projectDir = file('poc/runtime')

include 'poc-native'
project(':poc-native').projectDir = file('poc/native')
