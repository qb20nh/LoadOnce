plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	mavenCentral()
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

// The runtime is shared with the mod; the native probe runs without Minecraft.
sourceSets {
	main { java.exclude 'dev/loadonce/agent/**', 'dev/loadonce/supervisor/**' }
	contractTest {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
	prototype {
		compileClasspath += sourceSets.main.output
		runtimeClasspath += sourceSets.main.output
	}
	launcherTest {
		compileClasspath += files(layout.buildDirectory.dir('classes/standaloneRuntime'))
		runtimeClasspath += files(layout.buildDirectory.dir('classes/standaloneRuntime'))
	}
	agentTest {
		compileClasspath += files(layout.buildDirectory.dir('classes/standaloneAgent'))
		runtimeClasspath += files(layout.buildDirectory.dir('classes/standaloneAgent'))
	}
}

loom {
	splitEnvironmentSourceSets()
	if (providers.gradleProperty('loadonceMenuProbe').getOrElse('false').toBoolean()) {
		runs {
			client {
				runDir providers.gradleProperty('loadonceMenuGameDir').getOrElse('build/menu-probe/game')
			}
		}
	}

	mods {
		"modid" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	['lwjgl', 'lwjgl-glfw', 'lwjgl-opengl', 'lwjgl-openal'].each { module ->
		prototypeImplementation "org.lwjgl:${module}:3.4.3"
		prototypeRuntimeOnly "org.lwjgl:${module}:3.4.3:natives-linux"
	}
}

tasks.register('runtimeContractTest', JavaExec) {
	group = 'verification'
	description = 'Exercises checkpoint ordering, rollback, failure and thread contracts.'
	classpath = sourceSets.contractTest.runtimeClasspath
	mainClass = 'dev.loadonce.runtime.RuntimeContractTest'
}

tasks.named('check') {
	dependsOn tasks.named('runtimeContractTest'), tasks.named('prototypeClasses'), 'launcherContractTest', 'agentContractTest'
}

tasks.register('nativeRestorationProbe', JavaExec) {
	group = 'verification'
	description = 'Recreates real GLFW, OpenGL and OpenAL resources; requires a display and audio backend.'
	classpath = sourceSets.prototype.runtimeClasspath
	mainClass = 'dev.loadonce.prototype.NativeRestorationProbe'
	jvmArgs '--enable-native-access=ALL-UNNAMED'
	args "--cycles=${providers.gradleProperty('loadonceCycles').getOrElse('3')}"
	if (providers.gradleProperty('loadonceUseCrac').getOrElse('false').toBoolean()) {
		args '--crac'
	}
	if (providers.gradleProperty('loadonceInvalidShader').getOrElse('false').toBoolean()) {
		args '--invalid-shader-on-restore'
	}
	if (providers.gradleProperty('loadonceAudioLoopback').getOrElse('false').toBoolean()) {
		args '--audio-loopback'
	}
	if (providers.gradleProperty('loadonceReconfigure').getOrElse('false').toBoolean()) {
		args '--reconfigure'
	}
	if (providers.gradleProperty('loadonceCracJava').isPresent()) {
		executable = providers.gradleProperty('loadonceCracJava').get()
	}
	if (providers.gradleProperty('loadonceCracEngine').isPresent()) {
		jvmArgs "-XX:CRaCEngine=${providers.gradleProperty('loadonceCracEngine').get()}",
				"-XX:CRaCCheckpointTo=${layout.buildDirectory.dir('crac-probe').get().asFile}"
	}
}

// Allows the native CRaC smoke to launch a clean JVM without inheriting Gradle's
// environment or open descriptors. The classpath is local build output only.
def nativeProbeClasspath = sourceSets.prototype.runtimeClasspath
def nativeProbeClasspathFile = layout.buildDirectory.file('native-probe-classpath.txt')
tasks.register('writeNativeProbeClasspath') {
	group = 'verification'
	description = 'Writes the standalone native probe classpath for the clean CRaC smoke driver.'
	dependsOn tasks.named('prototypeClasses')
	inputs.files(nativeProbeClasspath)
	outputs.file(nativeProbeClasspathFile)
	doLast {
		nativeProbeClasspathFile.get().asFile.text = nativeProbeClasspath.filter { it.exists() }.asPath + '\n'
	}
}

tasks.register('cracSmoke', JavaExec) {
	group = 'verification'
	description = 'Invokes the real optional jdk.crac API on an isolated CPU-only probe.'
	classpath = sourceSets.main.output
	mainClass = 'dev.loadonce.runtime.CracSmoke'
	if (providers.gradleProperty('loadonceCracJava').isPresent()) {
		executable = providers.gradleProperty('loadonceCracJava').get()
	}
	if (providers.gradleProperty('loadonceCracEngine').isPresent()) {
		jvmArgs "-XX:CRaCEngine=${providers.gradleProperty('loadonceCracEngine').get()}",
				"-XX:CRaCCheckpointTo=${layout.buildDirectory.dir('crac-smoke').get().asFile}"
	}
}

tasks.named('runClient', JavaExec) {
	if (providers.gradleProperty('loadonceClientJava').isPresent()) {
		executable = providers.gradleProperty('loadonceClientJava').get()
	}
	if (providers.gradleProperty('loadonceAgent').getOrElse('false').toBoolean()) {
		dependsOn 'agentJar'
		jvmArgs "-javaagent:${layout.buildDirectory.file('libs/modid-' + project.version + '-agent.jar').get().asFile}"
	}
	if (providers.gradleProperty('loadonceMenuProbe').getOrElse('false').toBoolean()) {
		jvmArgs '-Dloadonce.menuProbe=true', '-Dloadonce.menuProbe.exit=true',
				"-Dloadonce.menuProbe.frames=${providers.gradleProperty('loadonceMenuFrames').getOrElse('3')}",
				"-Dloadonce.menuProbe.timeoutSeconds=${providers.gradleProperty('loadonceMenuTimeout').getOrElse('120')}"
		if (providers.gradleProperty('loadonceMenuScreenshot').getOrElse('false').toBoolean()) {
			jvmArgs '-Dloadonce.menuProbe.screenshot=true'
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

def standaloneRuntime = tasks.register('compileStandaloneRuntime', JavaCompile) {
	source = fileTree('src/main/java/dev/loadonce') {
		include 'runtime/**/*.java', 'launcher/**/*.java', 'supervisor/**/*.java'
	}
	classpath = files()
	destinationDirectory = layout.buildDirectory.dir('classes/standaloneRuntime')
	options.release = 17
}

def standaloneAgent = tasks.register('compileStandaloneAgent', JavaCompile) {
	source = fileTree('src/main/java/dev/loadonce/agent') { include '**/*.java' }
	classpath = files()
	destinationDirectory = layout.buildDirectory.dir('classes/standaloneAgent')
	options.release = 17
}

tasks.register('runtimeJar', Jar) {
	group = 'build'
	description = 'Packages the Java 17 checkpoint runtime without Minecraft or Fabric dependencies.'
	archiveClassifier = 'runtime'
	dependsOn standaloneRuntime
	from standaloneRuntime.flatMap { it.destinationDirectory }
	include 'dev/loadonce/runtime/**', 'LICENSE'
	from 'LICENSE'
}

tasks.register('launcherJar', Jar) {
	group = 'build'
	description = 'Packages the dependency-free Java/javaw launcher and checkpoint runtime.'
	archiveClassifier = 'launcher'
	dependsOn standaloneRuntime
	from standaloneRuntime.flatMap { it.destinationDirectory }
	exclude 'dev/loadonce/agent/**'
	from 'LICENSE'
	manifest { attributes 'Main-Class': 'dev.loadonce.launcher.LoadOnce' }
}

def agentJar = tasks.register('agentJar', Jar) {
	group = 'build'
	description = 'Packages the Java 17 premain agent for external launchers, without a wrapper JVM.'
	archiveClassifier = 'agent'
	dependsOn standaloneAgent
	from standaloneAgent.flatMap { it.destinationDirectory }
	from 'LICENSE'
	manifest {
		attributes 'Premain-Class': 'dev.loadonce.agent.LoadOnceAgent',
				'Can-Redefine-Classes': 'false', 'Can-Retransform-Classes': 'false'
	}
}

tasks.named('compileAgentTestJava', JavaCompile) {
	dependsOn standaloneAgent
	options.release = 17
}

tasks.register('agentContractTest', JavaExec) {
	group = 'verification'
	description = 'Verifies premain in the original application JVM and sanitized agent startup.'
	dependsOn tasks.named('agentTestClasses'), agentJar
	classpath = sourceSets.agentTest.runtimeClasspath
	mainClass = 'dev.loadonce.agent.AgentContractTest'
	args '--agent-jar', agentJar.flatMap { it.archiveFile }.get().asFile.absolutePath
	if (providers.gradleProperty('loadonceCracJava').isPresent()) {
		args '--crac-java', providers.gradleProperty('loadonceCracJava').get()
	}
}

tasks.register('agentAotSmoke', JavaExec) {
	group = 'verification'
	description = 'Verifies direct JVM AOT training and use with the same premain agent.'
	dependsOn tasks.named('agentTestClasses'), agentJar
	classpath = sourceSets.agentTest.runtimeClasspath
	mainClass = 'dev.loadonce.agent.AgentAotSmoke'
	args '--agent-jar', agentJar.flatMap { it.archiveFile }.get().asFile.absolutePath
}

def redirectorDirectory = layout.buildDirectory.dir('native-redirectors').get().asFile
def nativeBuildDirectory = layout.buildDirectory.dir('native-redirector-build').get().asFile
def nativeSourceFile = layout.projectDirectory.file('native/redirector.c').asFile
def nativeSourceDirectory = layout.projectDirectory.dir('native').asFile
def nativePlatform = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') ? 'windows' : 'linux'

def nativeRedirectors = tasks.register('nativeRedirectors', Exec) {
	group = 'build'
	description = 'Builds private Java executable forwarding stubs for this host platform.'
	inputs.file(nativeSourceFile)
	inputs.file(layout.projectDirectory.file('native/linux_supervisor.h'))
	inputs.file(layout.projectDirectory.file('native/CMakeLists.txt'))
	outputs.files(new File(redirectorDirectory, nativePlatform == 'windows' ? 'java.exe' : 'java'))
	if (nativePlatform == 'windows') {
		outputs.file(new File(redirectorDirectory, 'javaw.exe'))
		inputs.file(layout.projectDirectory.file('native/wide_argument_witness.c'))
		outputs.file(new File(redirectorDirectory, 'wide-argument-witness.exe'))
		commandLine 'cmake', '--build', nativeBuildDirectory.absolutePath, '--config', 'Release'
		dependsOn 'configureNativeRedirectors'
	} else {
		commandLine 'gcc', '-std=c11', '-O2', '-Wall', '-Wextra', '-Werror',
				nativeSourceFile.absolutePath, '-o', new File(redirectorDirectory, 'java').absolutePath
		doFirst { redirectorDirectory.mkdirs() }
	}
}

tasks.register('configureNativeRedirectors', Exec) {
	group = 'build'
	description = 'Configures the Windows console/windowed forwarding executables.'
	inputs.dir(nativeSourceDirectory)
	outputs.file(new File(nativeBuildDirectory, 'CMakeCache.txt'))
	commandLine 'cmake', '-S', nativeSourceDirectory.absolutePath, '-B', nativeBuildDirectory.absolutePath,
			"-DCMAKE_RUNTIME_OUTPUT_DIRECTORY=${redirectorDirectory.absolutePath}",
			"-DCMAKE_RUNTIME_OUTPUT_DIRECTORY_RELEASE=${redirectorDirectory.absolutePath}"
}

tasks.register('redirectorSmoke', JavaExec) {
	group = 'verification'
	description = 'Verifies native forwarding, launcher probes, arguments and cancellation on this platform.'
	dependsOn tasks.named('agentTestClasses'), agentJar, 'launcherJar', nativeRedirectors
	classpath = sourceSets.agentTest.runtimeClasspath
	mainClass = 'dev.loadonce.agent.RuntimeRedirectTest'
	args '--agent-jar', agentJar.flatMap { it.archiveFile }.get().asFile.absolutePath,
			'--supervisor-jar', tasks.named('launcherJar', Jar).flatMap { it.archiveFile }.get().asFile.absolutePath,
			'--redirectors-dir', redirectorDirectory.absolutePath
}

tasks.register('supervisorAotSmoke', JavaExec) {
	group = 'verification'
	description = 'Verifies external executable startup policy against real AOT caches and fallback.'
	dependsOn tasks.named('agentTestClasses'), agentJar, 'launcherJar', nativeRedirectors
	classpath = sourceSets.agentTest.runtimeClasspath
	mainClass = 'dev.loadonce.agent.SupervisorAotSmoke'
	args '--agent-jar', agentJar.flatMap { it.archiveFile }.get().asFile.absolutePath,
			'--supervisor-jar', tasks.named('launcherJar', Jar).flatMap { it.archiveFile }.get().asFile.absolutePath,
			'--redirectors-dir', redirectorDirectory.absolutePath
}

// The subprocess harness quotes literal Windows arguments itself. Legacy
// ProcessBuilder accepts those complete tokens without stripping interior quotes.
['agentContractTest', 'agentAotSmoke', 'redirectorSmoke', 'supervisorAotSmoke'].each { taskName ->
	tasks.named(taskName, JavaExec) {
		jvmArgs '-Djdk.lang.Process.allowAmbiguousCommands=true'
	}
}

tasks.register('redirectorDistribution', Zip) {
	group = 'distribution'
	description = 'Packages the Java supervisor, agent and native executables for external launchers.'
	dependsOn agentJar, 'launcherJar', nativeRedirectors
	archiveClassifier = "redirector-${nativePlatform}"
	destinationDirectory = layout.buildDirectory.dir('distributions')
	from(agentJar.flatMap { it.archiveFile })
	from(tasks.named('launcherJar', Jar).flatMap { it.archiveFile })
	from(redirectorDirectory) {
		include 'java', 'java.exe', 'javaw.exe'
		into 'redirectors'
		filePermissions { unix('rwxr-xr-x') }
	}
	from 'LICENSE'
	from('docs/external-launchers.md') { rename { 'INSTALL.md' } }
}

tasks.named('compileLauncherTestJava', JavaCompile) {
	dependsOn standaloneRuntime
	options.release = 17
}

tasks.register('launcherContractTest', JavaExec) {
	group = 'verification'
	description = 'Exercises Java launcher privacy, fingerprints, fallback and process contracts.'
	dependsOn tasks.named('launcherTestClasses')
	classpath = sourceSets.launcherTest.runtimeClasspath
	mainClass = 'dev.loadonce.launcher.LauncherContractSuite'
}

def launcherTestClasspath = sourceSets.launcherTest.runtimeClasspath
def launcherTestClasspathFile = layout.buildDirectory.file('launcher-test-classpath.txt')
tasks.register('writeLauncherTestClasspath') {
	group = 'verification'
	description = 'Writes the Java integration harness classpath for direct launches.'
	dependsOn tasks.named('launcherTestClasses')
	inputs.files(launcherTestClasspath)
	outputs.file(launcherTestClasspathFile)
	doLast {
		launcherTestClasspathFile.get().asFile.text = launcherTestClasspath.filter { it.exists() }.asPath + '\n'
	}
}

tasks.register('leydenSmoke', JavaExec) {
	group = 'verification'
	description = 'Verifies real AOT cache training/mapping and one-launch fallback on the selected JDK.'
	dependsOn tasks.named('launcherTestClasses')
	classpath = sourceSets.launcherTest.runtimeClasspath
	mainClass = 'dev.loadonce.launcher.LeydenSmoke'
}

tasks.register('cracIntegrationSmoke', JavaExec) {
	group = 'verification'
	description = 'Verifies isolated CRaC images, fresh-process reconstruction and manifest fallback.'
	dependsOn tasks.named('launcherTestClasses'), tasks.named('runtimeJar')
	classpath = sourceSets.launcherTest.runtimeClasspath
	mainClass = 'dev.loadonce.launcher.CracIntegrationSmoke'
	if (providers.gradleProperty('loadonceCracJava').isPresent()) {
		args '--java', providers.gradleProperty('loadonceCracJava').get()
	}
	if (providers.gradleProperty('loadonceCracEngine').isPresent()) {
		args '--engine', providers.gradleProperty('loadonceCracEngine').get()
	}
	if (providers.gradleProperty('loadonceNativeCrac').getOrElse('false').toBoolean()) {
		dependsOn tasks.named('writeNativeProbeClasspath')
		args '--native-classpath-file', nativeProbeClasspathFile.get().asFile.absolutePath
	}
	if (providers.gradleProperty('loadonceReconfigure').getOrElse('false').toBoolean()) {
		args '--native-reconfigure'
	}
}

tasks.register('nativeDisplaySmoke', JavaExec) {
	group = 'verification'
	description = 'Runs native reconstruction on a private authenticated software display using Java.'
	dependsOn tasks.named('launcherTestClasses'), tasks.named('writeNativeProbeClasspath')
	classpath = sourceSets.launcherTest.runtimeClasspath
	mainClass = 'dev.loadonce.launcher.NativeDisplaySmoke'
	if (providers.gradleProperty('loadonceXvfb').isPresent()) {
		args '--xvfb', providers.gradleProperty('loadonceXvfb').get()
	}
	args '--cycles', providers.gradleProperty('loadonceCycles').getOrElse('10')
	if (providers.gradleProperty('loadonceReconfigure').getOrElse('false').toBoolean()) args '--reconfigure'
	if (providers.gradleProperty('loadonceInvalidShader').getOrElse('false').toBoolean()) args '--invalid-shader'
}

tasks.named('build') {
	dependsOn tasks.named('runtimeJar'), tasks.named('launcherJar'), agentJar
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

tasks.named('sourcesJar') {
	from('src/main/java') { include 'dev/loadonce/agent/**', 'dev/loadonce/supervisor/**' }
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
