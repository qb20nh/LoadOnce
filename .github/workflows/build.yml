# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: real Leyden smoke
        run: ./gradlew leydenSmoke agentAotSmoke
      - name: Linux Java executable redirection
        run: ./gradlew redirectorSmoke supervisorAotSmoke redirectorDistribution
      - name: software graphics and rendered audio smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0
          ./gradlew nativeDisplaySmoke
      - name: runtime-changed window and audio restoration
        run: ./gradlew nativeDisplaySmoke -PloadonceReconfigure=true
      - name: native restoration failure cleanup
        run: ./gradlew nativeDisplaySmoke -PloadonceReconfigure=true -PloadonceInvalidShader=true
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: |
            build/libs/
            build/distributions/

  windows-redirectors:
    runs-on: windows-2025
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: Windows java and javaw forwarding
        run: .\gradlew.bat --no-daemon --continue agentContractTest agentAotSmoke redirectorSmoke supervisorAotSmoke redirectorDistribution
      - name: capture Windows redirector distribution
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Redirectors
          path: |
            build/libs/*-agent.jar
            build/libs/*-launcher.jar
            build/distributions/
