# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: launcher contract tests
        run: python3 -m unittest discover -s tests -v
      - name: real Leyden smoke
        run: python3 tests/smoke_leyden.py
      - name: software graphics and rendered audio smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libglx-mesa0
          tools/native-smoke.sh
      - name: runtime-changed window and audio restoration
        run: tools/native-smoke.sh -- nativeRestorationProbe -PloadonceCycles=10 -PloadonceAudioLoopback=true -PloadonceReconfigure=true
      - name: native restoration failure cleanup
        run: |
          if tools/native-smoke.sh -- nativeRestorationProbe -PloadonceAudioLoopback=true -PloadonceReconfigure=true -PloadonceInvalidShader=true > build/native-failure.log 2>&1; then
            cat build/native-failure.log
            exit 1
          fi
          python3 - <<'PY'
          from pathlib import Path
          output = Path('build/native-failure.log').read_text()
          for required in ('coordinator-state=STOPPED', 'failure-stop-verified=true', 'cleanup=tracked-handles-zero native-release=ok'):
              assert required in output, output
          PY
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
